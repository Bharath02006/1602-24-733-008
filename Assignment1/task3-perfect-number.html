<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Number Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .container {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: #2980b9;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <h1>Perfect Number Checker</h1>

    <div class="container">
        <label for="number">Enter a Number:</label>
        <input type="number" id="number" placeholder="Enter a positive integer">

        <button onclick="checkPerfectNumber()">Check</button>

        <div id="result"></div>
    </div>

    <script>
        // Function to check if a number is perfect
        function isPerfect(num) {
            if (num <= 1) {
                return false;
            }

            var sum = 0;
            for (var i = 1; i < num; i++) {
                if (num % i === 0) {
                    sum = sum + i;
                }
            }

            return sum === num;
        }

        // Function to find nearest perfect number less than given number
        function findNearestPerfect(num) {
            for (var i = num - 1; i >= 1; i--) {
                if (isPerfect(i)) {
                    return i;
                }
            }
            return null;
        }

        // Main function to check the input number
        function checkPerfectNumber() {
            var input = document.getElementById("number").value;
            var num = parseInt(input);
            var resultDiv = document.getElementById("result");

            if (isNaN(num) || num < 1) {
                resultDiv.innerHTML = "Please enter a valid positive integer.";
                return;
            }

            if (isPerfect(num)) {
                resultDiv.innerHTML = num + " is a Perfect Number.";
            } else {
                var nearest = findNearestPerfect(num);
                if (nearest !== null) {
                    resultDiv.innerHTML = num + " is NOT a Perfect Number.<br>" +
                        "Nearest Perfect Number less than " + num + " is: " + nearest;
                } else {
                    resultDiv.innerHTML = num + " is NOT a Perfect Number.<br>" +
                        "No Perfect Number found less than " + num + ".";
                }
            }
        }
    </script>
</body>
</html>
